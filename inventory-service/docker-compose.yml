# Separate from the repository-root compose file on purpose: the inventory
# service owns its own database and its own lifecycle, and must be startable
# and stoppable without touching the main application.
#
# Run it from THIS directory:  docker compose up --build
# The build context is `..` so the shared proto/ directory is reachable.

name: inventory-service

services:
  inventory-postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-inventory}
    ports:
      # 5434 on the host: 5432 is a local PostgreSQL install and 5433 is the
      # main application's database in the root compose file.
      - '${DB_EXPOSED_PORT:-5434}:5432'
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-inventory}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build:
      context: ..
      dockerfile: inventory-service/Dockerfile
      target: runtime
    container_name: inventory-service
    restart: unless-stopped
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      DB_HOST: inventory-postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-inventory}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      INVENTORY_ARTIFICIAL_DELAY_MS: ${INVENTORY_ARTIFICIAL_DELAY_MS:-0}
      LOG_LEVELS: ${LOG_LEVELS:-error,warn,log}
    # Migrations and seed run to completion before the server accepts traffic,
    # using the compiled output: the runtime image ships no TypeScript, no buf
    # and no ts-proto.
    command: >
      sh -c "node ./node_modules/typeorm/cli.js --dataSource dist/database/data-source.js migration:run
      && node dist/database/seed.js
      && node dist/main"
    ports:
      - '${GRPC_EXPOSED_PORT:-50051}:50051'
    healthcheck:
      # A real probe: dist/healthcheck.js calls grpc.health.v1.Health/Check and
      # exits non-zero unless the answer is SERVING. Docker has no native gRPC
      # probe, and this needs no extra binary in the image.
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  inventory-postgres-data:
