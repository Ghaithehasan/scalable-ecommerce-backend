syntax = "proto3";
package inventory.v1;

// Contract between the main e-commerce application (client) and the inventory
// service (server).
//
// Design decisions encoded here:
//
// 1. product_id is a string, not an integer. The main application currently
//    uses integer primary keys, but the contract must not depend on that: if
//    the catalogue ever moves to UUIDs, this file and the inventory service
//    stay unchanged. The caller is responsible for the conversion.
//
// 2. reservation_id is generated by the CALLER (a UUID) before the call. That
//    makes every operation idempotent: a retry after a timeout reuses the same
//    id and cannot reserve twice, and a compensating ReleaseStock can always
//    name the reservation it is undoing, even if the original response was
//    never received.
//
// 3. "Not enough stock" is a BUSINESS OUTCOME, not an error. It is reported in
//    the response as reserved = false plus the shortages that caused it, so the
//    caller can show the user exactly which items are short. gRPC status codes
//    are reserved for technical problems:
//      INVALID_ARGUMENT    missing reservation_id, empty items, quantity <= 0,
//                          or the same product listed twice in one request
//      NOT_FOUND           a product id the inventory service does not know
//      FAILED_PRECONDITION ReserveStock on a reservation_id already RELEASED
//      INTERNAL            anything unexpected
//
// 4. ReserveStock is all-or-nothing: either every item is reserved or nothing
//    is, and the response lists every shortage rather than stopping at the
//    first one.

service InventoryService {
  // Reads current levels for a batch of products. Unknown ids are omitted from
  // the response rather than being an error, so the caller can ask about a
  // whole page of products without knowing which ones are stocked.
  rpc GetStock(GetStockRequest) returns (GetStockResponse);

  // Checks and reserves every item atomically. Idempotent on reservation_id.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // Returns a reservation's quantities to available stock. Idempotent.
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetStockRequest { repeated string product_ids = 1; }
message StockLevel { string product_id = 1; int32 available = 2; int32 reserved = 3; }
message GetStockResponse { repeated StockLevel items = 1; }

message ReserveItem { string product_id = 1; int32 quantity = 2; }
message ReserveStockRequest { string reservation_id = 1; repeated ReserveItem items = 2; }
message Shortage { string product_id = 1; int32 requested = 2; int32 available = 3; }
message ReserveStockResponse { bool reserved = 1; repeated Shortage shortages = 2; }

message ReleaseStockRequest { string reservation_id = 1; }
message ReleaseStockResponse { bool released = 1; }
